<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.13/
dist/lenis.css">
<script src="https://unpkg.com/lenis@1.3.11/dist/
lenis.min.js"></script>
<script>
    window.lenis = new Lenis({ autoRaf: true });
</script>
</script>
<style>
/* Дозволяємо скрол в середині попапа на формі (Lenis) */
.quiz_form[data-scrollable] {
max-height: 100svh;
overflow: auto !important;
-webkit-overflow-scrolling: touch;
touch-action: pan-y !important;
overscroll-behavior: contain;
}
/* Оболонка не блокує скрол форми */
.quiz_form-block {
overflow: visible !important;
}
/* Дозволяємо скрол всередині модалки */
[data-scrollable] {
overflow: auto !important;
max-height: 100svh;
-webkit-overflow-scrolling: touch;
touch-action: pan-y !important;
overscroll-behavior: contain;
overscroll-behavior: contain;
}
</style>
<script>
// Lenis attribute handler (data-lenis-stop/start/toggle)
document.addEventListener('click', function(e){
const el = e.target.closest('[data-lenis-stop],[data-lenis-start],[data-lenis-toggle]');
      if(!el) return;
      if (el.hasAttribute('data-lenis-toggle')) {
           if (window.lenis && window.lenis.isStopped)
      { window.lenis.start(); } else { window.lenis &&
            window.lenis.stop(); }
      return;   
      }
      if (el.hasAttribute('data-lenis-stop')) { window.lenis &&
      window.lenis.stop(); return; }
      if (el.hasAttribute('data-lenis-start')) { window.lenis &&
      window.lenis.start(); return; }
      });
</script>
