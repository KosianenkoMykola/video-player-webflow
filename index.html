<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NiceGuysPlayer Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    NiceGuysPlayer for Webflow (Vercel-ready)
    Usage:
      <iframe src="https://your-vercel-domain.vercel.app/?src=YOUR_VIDEO_LINK" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
    Replace YOUR_VIDEO_LINK with a direct .mp4/.webm link.
  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- =====================
 1. HTML (Embed у Webflow)
 Скопіюйте цей блок <div class="glass-player" id="playerContainer"> у Embed-блок Webflow
===================== -->
<div class="glass-player" id="playerContainer">
  <a class="niceguys-label" id="niceguysLabel" href="https://www.niceguys.agency/" target="_blank" rel="noopener noreferrer">NiceGuysPlayer</a>
  <video id="myVideo" src="/video/IMG_9701.MP4" preload="metadata"></video>
  <button class="center-play" id="centerPlayBtn" aria-label="Play">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="24" fill="rgba(255,255,255,0.25)"/>
      <polygon points="18,14 36,24 18,34" fill="currentColor"/>
    </svg>
  </button>
  <div class="controls visible" id="controlsBar">
    <div class="controls-container">
      <button class="glass-btn" id="rewindBtn" title="Back 15s">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
    </button>
    <button class="glass-btn" id="playPauseBtn" title="Play/Pause">
      <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <polygon points="6,4 20,12 6,20" fill="currentColor"/>
      </svg>
      <svg id="pauseIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none;">
        <rect x="6" y="4" width="4" height="16" fill="currentColor"/>
        <rect x="14" y="4" width="4" height="16" fill="currentColor"/>
      </svg>
    </button>
    <button class="glass-btn" id="forwardBtn" title="Forward 15s">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
    </button>
    </div>
    <div class="controls-container">
      <div class="volume-container">
      <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volumeSlider" title="Volume">
    <button class="glass-btn" id="muteBtn" title="Mute/Unmute">
      <svg id="volumeIcon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <polygon points="5,9 9,9 13,5 13,19 9,15 5,15" fill="currentColor"/>
        <path d="M16 8c1.5 1.5 1.5 6 0 7.5" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
      <svg id="muteIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none;">
        <polygon points="5,9 9,9 13,5 13,19 9,15 5,15" fill="currentColor"/>
        <line x1="17" y1="7" x2="21" y2="17" stroke="currentColor" stroke-width="2"/>
        <line x1="21" y1="7" x2="17" y2="17" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
    </div>
    <button class="glass-btn" id="pipBtn" title="Picture in Picture">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
        <rect x="12" y="11" width="8" height="5" rx="1" fill="currentColor"/>
      </svg>
    </button>
    <button class="glass-btn" id="fullscreenBtn" title="Fullscreen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <polyline points="4,8 4,4 8,4" stroke="currentColor" stroke-width="2" fill="none"/>
        <polyline points="16,4 20,4 20,8" stroke="currentColor" stroke-width="2" fill="none"/>
        <polyline points="20,16 20,20 16,20" stroke="currentColor" stroke-width="2" fill="none"/>
        <polyline points="8,20 4,20 4,16" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
    </button>
    </div>
  </div>
  <div class="progress-bar" id="progressBar">
    <div class="progress" id="progress"></div>
  </div>
  <div class="time" id="timeDisplay">00:00 / 00:00</div>
</div>

<!-- =====================
 2. CSS (Style у Webflow або у <style> в Embed)
 Скопіюйте вміст style.css у <style>...</style> у Embed або у налаштування сторінки Webflow
===================== -->

<!-- =====================
 3. JS (Script у Webflow або у <script> в Embed)
 Скопіюйте цей скрипт у <script>...</script> у Embed або у налаштування сторінки Webflow
===================== -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const urlParams = new URLSearchParams(window.location.search);
    const globalParamSrc = urlParams.get('src');

    const containers = document.querySelectorAll('.glass-player');
    const videos = [];

    containers.forEach(function (playerContainer) {
      const video = playerContainer.querySelector('video');
      if (!video) return;

      // Allow per-page override via ?src=... OR per-player via data-video-src
      const attrSrc = playerContainer.getAttribute('data-video-src');
      if (globalParamSrc) {
        video.src = globalParamSrc;
      } else if (attrSrc) {
        video.src = attrSrc;
      }

      videos.push(video);

      // Scoped controls inside this container
      const playPauseBtn = playerContainer.querySelector('#playPauseBtn');
      const rewindBtn = playerContainer.querySelector('#rewindBtn');
      const forwardBtn = playerContainer.querySelector('#forwardBtn');
      const fullscreenBtn = playerContainer.querySelector('#fullscreenBtn');
      const pipBtn = playerContainer.querySelector('#pipBtn');
      const muteBtn = playerContainer.querySelector('#muteBtn');
      const volumeSlider = playerContainer.querySelector('#volumeSlider');
      const progressBar = playerContainer.querySelector('#progressBar');
      const progress = playerContainer.querySelector('#progress');
      const timeDisplay = playerContainer.querySelector('#timeDisplay');
      const centerPlayBtn = playerContainer.querySelector('#centerPlayBtn');
      const controlsBar = playerContainer.querySelector('#controlsBar');
      const niceguysLabel = playerContainer.querySelector('#niceguysLabel');
      const playIcon = playerContainer.querySelector('#playIcon');
      const pauseIcon = playerContainer.querySelector('#pauseIcon');
      const volumeIcon = playerContainer.querySelector('#volumeIcon');
      const muteIcon = playerContainer.querySelector('#muteIcon');

      let controlsTimeout;
      let isMouseOver = false;
      let hasStarted = false;

      // Remove native controls
      video.removeAttribute('controls');

      function showControls() {
        if (!hasStarted) return;
        if (controlsBar) {
          controlsBar.classList.add('visible');
          controlsBar.classList.remove('hidden');
        }
        if (timeDisplay) timeDisplay.classList.remove('hidden');
        if (niceguysLabel) niceguysLabel.classList.remove('hidden');
        if (progressBar) progressBar.classList.remove('hidden');
        clearTimeout(controlsTimeout);
        if (!video.paused) {
          controlsTimeout = setTimeout(hideControls, 2500);
        }
      }

      function hideControls() {
        if (!isMouseOver && !video.paused) {
          if (controlsBar) {
            controlsBar.classList.remove('visible');
            controlsBar.classList.add('hidden');
          }
          if (timeDisplay) timeDisplay.classList.add('hidden');
          if (niceguysLabel) niceguysLabel.classList.add('hidden');
          if (progressBar) progressBar.classList.add('hidden');
        }
      }

      playerContainer.addEventListener('mousemove', showControls);
      playerContainer.addEventListener('touchstart', showControls);
      if (controlsBar) {
        controlsBar.addEventListener('mouseenter', function () { isMouseOver = true; });
        controlsBar.addEventListener('mouseleave', function () { isMouseOver = false; });
      }
      video.addEventListener('play', showControls);
      video.addEventListener('pause', showControls);
      video.addEventListener('ended', showControls);

      // inactivity
      video.addEventListener('play', function () {
        controlsTimeout = setTimeout(hideControls, 2500);
      });
      video.addEventListener('pause', function () {
        clearTimeout(controlsTimeout);
        showControls();
      });

      function showCenterPlay() { if (centerPlayBtn) centerPlayBtn.classList.remove('hidden'); }
      function hideCenterPlay() { if (centerPlayBtn) centerPlayBtn.classList.add('hidden'); }

      if (centerPlayBtn) {
        centerPlayBtn.addEventListener('click', function () {
          video.play();
          hideCenterPlay();
          hasStarted = true;
          if (controlsBar) {
            controlsBar.classList.add('visible');
            controlsBar.classList.remove('hidden');
          }
          if (timeDisplay) timeDisplay.classList.remove('hidden');
          if (niceguysLabel) niceguysLabel.classList.remove('hidden');
          if (progressBar) progressBar.classList.remove('hidden');
        });
      }
      video.addEventListener('play', hideCenterPlay);
      video.addEventListener('pause', function () {
        if (video.currentTime === 0 || video.currentTime === video.duration) {
          showCenterPlay();
        } else {
          showControls();
        }
      });

      if (video.paused) {
        showCenterPlay();
        if (controlsBar) {
          controlsBar.classList.remove('visible');
          controlsBar.classList.add('hidden');
        }
        if (timeDisplay) timeDisplay.classList.add('hidden');
        if (niceguysLabel) niceguysLabel.classList.add('hidden');
        if (progressBar) progressBar.classList.add('hidden');
      }

      // play/pause
      if (playPauseBtn) {
        playPauseBtn.onclick = function () {
          if (video.paused) video.play(); else video.pause();
        };
      }
      video.addEventListener('play', function () {
        // pause the others
        videos.forEach(function (v) { if (v !== video) v.pause(); });
        if (playIcon && pauseIcon) { playIcon.style.display = 'none'; pauseIcon.style.display = 'inline'; }
      });
      video.addEventListener('pause', function () {
        if (playIcon && pauseIcon) { playIcon.style.display = 'inline'; pauseIcon.style.display = 'none'; }
      });

      // seek +/-
      if (rewindBtn) {
        rewindBtn.onclick = function () { video.currentTime = Math.max(0, video.currentTime - 15); showControls(); };
      }
      if (forwardBtn) {
        forwardBtn.onclick = function () { video.currentTime = Math.min(video.duration || 0, video.currentTime + 15); showControls(); };
      }

      // fullscreen per container
      function isFullScreen() {
        return document.fullscreenElement === playerContainer || document.webkitFullscreenElement === playerContainer || document.msFullscreenElement === playerContainer;
      }
      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      }
      // PiP: show only when supported and not iOS
      const pipSupported = 'pictureInPictureEnabled' in document && typeof video.requestPictureInPicture === 'function';
      if (pipBtn) {
        if (!pipSupported || isIOS()) {
          pipBtn.style.display = 'none';
        } else {
          pipBtn.onclick = async function () {
            try {
              if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
              } else {
                await video.requestPictureInPicture();
              }
              showControls();
            } catch (e) {}
          };
        }
      }
      if (fullscreenBtn) {
        fullscreenBtn.onclick = function () {
          // iOS Safari/Chrome: request fullscreen on <video>
          if (isIOS() && typeof video.webkitEnterFullscreen === 'function') {
            try { video.webkitEnterFullscreen(); } catch (e) {}
            return;
          }
          if (!isFullScreen()) {
            if (playerContainer.requestFullscreen) playerContainer.requestFullscreen();
            else if (playerContainer.webkitRequestFullscreen) playerContainer.webkitRequestFullscreen();
            else if (playerContainer.msRequestFullscreen) playerContainer.msRequestFullscreen();
          } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
          }
          showControls();
        };
      }

      // volume/mute
      if (volumeSlider) {
        volumeSlider.oninput = function () {
          video.volume = this.value;
          updateVolumeIcon();
          showControls();
        };
      }
      if (muteBtn) {
        muteBtn.onclick = function () {
          video.muted = !video.muted;
          updateVolumeIcon();
          if (volumeSlider) volumeSlider.value = video.muted ? 0 : video.volume;
          showControls();
        };
      }
      function updateVolumeIcon() {
        if (volumeIcon && muteIcon) {
          if (video.muted || video.volume === 0) {
            volumeIcon.style.display = 'none';
            muteIcon.style.display = 'inline';
          } else {
            volumeIcon.style.display = 'inline';
            muteIcon.style.display = 'none';
          }
        }
      }

      // progress/time
      video.addEventListener('timeupdate', function () {
        const percent = (video.currentTime / (video.duration || 1)) * 100;
        if (progress) progress.style.width = percent + '%';
        updateTimeDisplay();
      });
      video.addEventListener('loadedmetadata', updateTimeDisplay);

      if (progressBar) {
        progressBar.onclick = function (e) {
          const rect = progressBar.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const percent = x / rect.width;
          video.currentTime = percent * (video.duration || 0);
          showControls();
        };
      }

      function updateTimeDisplay() {
        if (!timeDisplay) return;
        const format = function (t) {
          if (isNaN(t)) return '00:00';
          const m = Math.floor(t / 60);
          const s = Math.floor(t % 60);
          return (m.toString().padStart(2,'0') + ':' + s.toString().padStart(2,'0'));
        };
        timeDisplay.textContent = format(video.currentTime) + ' / ' + format(video.duration);
      }

      // click on video toggles play
      video.addEventListener('click', function (e) {
        if (e.target.closest('.controls') || e.target.closest('.progress-bar')) return;
        if (video.paused) video.play(); else video.pause();
      });
    });
  });
</script>

<!-- =====================
 4. Інструкція
===================== -->
<!--
1. Додайте Embed-блок у Webflow на потрібну сторінку.
2. Вставте HTML-код (див. вище, частина 1).
3. Додайте CSS (частина 2) у <style> або у налаштування сторінки.
4. Додайте JS (частина 3) у <script> або у налаштування сторінки.
5. За потреби змініть src відео у <video> або зробіть динамічним через CMS.
-->
</body>
</html>
